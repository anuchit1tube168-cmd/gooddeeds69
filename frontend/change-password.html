<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เปลี่ยนรหัสผ่าน — ระบบบันทึกความดี</title>
  <link rel="stylesheet" href="style.css">
  <style>body{background:#f5f7fa;color:#132b49}main{max-width:440px;margin:6vh auto;padding:24px;background:white;border-radius:20px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;min-height:44px;padding:12px;font:inherit}button{margin-top:24px}#message{white-space:pre-wrap}</style>
</head>
<body><main>
  <h1>ตั้งรหัสผ่านใหม่</h1>
  <p>บัญชีนี้ต้องเปลี่ยนรหัสผ่านก่อนเริ่มใช้งาน</p>
  <form id="change-form">
    <label for="current">รหัสผ่านปัจจุบัน</label><input id="current" type="password" autocomplete="current-password" required>
    <label for="next">รหัสผ่านใหม่ อย่างน้อย 8 ตัวอักษร</label><input id="next" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">ยืนยันรหัสผ่านใหม่</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button id="save" type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <a href="index.html" id="back">กลับเข้าสู่ระบบ</a>
</main>
<script src="app.js?v=20260922-v3-login"></script>
<script src="gateway-client.js?v=20260922-v3-login"></script>
<script>
  const form = document.getElementById('change-form');
  const message = document.getElementById('message');
  const save = document.getElementById('save');
  const user = (typeof App !== 'undefined' && App.getCurrentUser) ? App.getCurrentUser() : null;
  const hasAuth = !!user || (typeof GoodDeedV2 !== 'undefined' && GoodDeedV2.getToken && !!GoodDeedV2.getToken());
  if (!hasAuth) {
    form.hidden = true;
    message.textContent = 'กรุณาเข้าสู่ระบบก่อนเปลี่ยนรหัสผ่าน';
  }
  document.getElementById('back').addEventListener('click', () => {
    if (typeof GoodDeedV2 !== 'undefined' && GoodDeedV2.clear) GoodDeedV2.clear();
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const next = document.getElementById('next').value.trim();
    if (next !== document.getElementById('confirm').value.trim()) {
      message.textContent = 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน'; return;
    }
    save.disabled = true; message.textContent = 'กำลังบันทึก…';
    try {
      if (user && user.student_id && typeof App !== 'undefined' && App.changePassword) {
        await App.changePassword(user.student_id, next);
      } else if (typeof GoodDeedV2 !== 'undefined' && GoodDeedV2.call) {
        const result = await GoodDeedV2.call('changePassword', {
          currentPassword: document.getElementById('current').value, newPassword: next
        });
        if (result.success !== true || result.reloginRequired !== true) throw new Error('ผลตอบกลับไม่ถูกต้อง');
        GoodDeedV2.clear();
      }
      form.reset(); form.hidden = true;
      message.textContent = 'เปลี่ยนรหัสผ่านแล้ว กรุณากดกลับเข้าสู่ระบบและใช้รหัสผ่านใหม่';
    } catch (error) {
      message.textContent = error.message === 'GAS_V2_TIMEOUT'
        ? 'ยังยืนยันผลไม่ได้ กรุณากลับเข้าสู่ระบบด้วยรหัสผ่านใหม่ก่อน หากไม่ได้จึงใช้รหัสเดิม'
        : 'เปลี่ยนรหัสผ่านไม่สำเร็จ: ' + error.message;
    } finally { save.disabled = false; }
  });
</script></body></html>
