name: PII Guard

on:
  push:
    branches: ["rtafnc-one-integration"]
  pull_request:
    branches: ["main"]

jobs:
  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block real identity literals from GitHub
        run: node scripts/pii-guard.mjs
