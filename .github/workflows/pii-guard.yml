name: RTAFNC ONE PII Guard

on:
  push:
    branches: ["rtafnc-one-integration"]
  pull_request:
    branches: ["main"]

jobs:
  pii-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for merge-base audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block new PDPA data, account IDs, secrets and data files
        env:
          PII_GUARD_MODE: changed
          # actions/checkout fetches remote branches but does not create a local main branch
          # when this workflow runs on rtafnc-one-integration. Compare against origin/main.
          PII_GUARD_BASE_REF: origin/main
        run: node scripts/pii-guard.mjs
      - name: Explain strict production policy
        run: |
          echo "Legacy repo runs in changed-file guard mode during cutover."
          echo "The clean RTAFNC ONE production repository must run PII_GUARD_MODE=full."
