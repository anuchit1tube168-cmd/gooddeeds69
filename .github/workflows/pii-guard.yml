name: RTAFNC ONE PDPA Guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal repository state read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Block new PDPA data and secrets
        env:
          PII_GUARD_MODE: changed
          PII_GUARD_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --version >/dev/null
          node scripts/pii-guard.mjs
