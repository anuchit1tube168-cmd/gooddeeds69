name: Good Deed legacy production contract check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-legacy-contract-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
    steps:
      - name: Inspect production transport without logging private data
        shell: bash
        run: |
          set -euo pipefail
          for action in health getStudents getDeeds getSettings; do
            curl -fsSL --max-time 30 "$GAS_URL?action=$action" -o "/tmp/$action.txt"
          done

          code=$(curl -sS -L --max-time 30 \
            -o /tmp/post-probe.txt -w '%{http_code}' \
            --data-urlencode 'action=diagnosticNoop' \
            --data-urlencode 'requestId=diag-transport-probe' \
            --data-urlencode 'origin=https://anuchit1tube168-cmd.github.io' \
            --data-urlencode 'payload={}' \
            "$GAS_URL")
          echo "POST_PROBE_HTTP=$code"

          python3 - <<'PY'
          import json, re
          for action in ('health','getStudents','getDeeds','getSettings'):
              raw=open(f'/tmp/{action}.txt', encoding='utf-8').read().strip()
              try:
                  obj=json.loads(raw)
                  if isinstance(obj,list): print(f'{action}: type=list count={len(obj)}')
                  elif isinstance(obj,dict):
                      print(f'{action}: type=dict keys=' + ','.join(sorted(obj.keys())))
                      if action == 'health':
                          print('health.service=' + str(obj.get('service','')))
                          print('health.version=' + str(obj.get('version','')))
                          print('health.message=' + str(obj.get('message','')))
              except Exception:
                  print(f'{action}: non_json prefix=' + re.sub(r'\s+',' ',raw[:100]))
          raw=open('/tmp/post-probe.txt', encoding='utf-8').read().strip()
          try:
              obj=json.loads(raw)
              print('POST_PROBE_JSON_KEYS=' + (','.join(sorted(obj.keys())) if isinstance(obj,dict) else type(obj).__name__))
          except Exception:
              print('POST_PROBE_MARKER=' + ('RTAFNC_GOODDEED' if 'RTAFNC_GOODDEED' in raw else 'HTML_OR_OTHER'))
          PY
