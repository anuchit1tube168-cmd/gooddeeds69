name: Good Deed Telegram action discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-legacy-contract-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
    steps:
      - name: Probe notification-only action names
        shell: bash
        run: |
          set -euo pipefail
          actions=(testTelegram testTelegramNotification telegram_test testNotification sendTestTelegram send_telegram_test test_telegram)
          for action in "${actions[@]}"; do
            curl -sS -L --max-time 30 \
              -o "/tmp/$action.txt" \
              --data-urlencode "action=$action" \
              --data-urlencode "requestId=diag-$action" \
              --data-urlencode 'origin=https://anuchit1tube168-cmd.github.io' \
              --data-urlencode 'payload={}' \
              "$GAS_URL"
          done
          python3 - <<'PY'
          import json,re
          actions=['testTelegram','testTelegramNotification','telegram_test','testNotification','sendTestTelegram','send_telegram_test','test_telegram']
          for action in actions:
              raw=open(f'/tmp/{action}.txt',encoding='utf-8').read().strip()
              try:
                  obj=json.loads(raw)
                  print(action + ': ' + ', '.join(f'{k}={str(obj.get(k))[:140]}' for k in ('ok','status','code','message','error') if isinstance(obj,dict) and k in obj))
                  continue
              except Exception:
                  pass
              m=re.search(r'parent\.postMessage\((\{.*?\}),',raw,re.S)
              if m:
                  try:
                      obj=json.loads(m.group(1))
                      print(action + ': bridge ' + ', '.join(f'{k}={str(obj.get(k))[:140]}' for k in ('ok','error') if k in obj))
                      continue
                  except Exception: pass
              print(action + ': OTHER')
          PY
