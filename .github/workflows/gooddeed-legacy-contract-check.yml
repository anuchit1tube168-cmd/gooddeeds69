name: Good Deed legacy production contract check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-legacy-contract-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
    steps:
      - name: Inspect legacy action shapes without logging PII
        shell: bash
        run: |
          set -euo pipefail
          for action in getStudents getDeeds getSettings; do
            curl -fsSL --max-time 30 "$GAS_URL?action=$action" -o "/tmp/$action.json"
          done
          python3 - <<'PY'
          import json
          for action in ('getStudents','getDeeds','getSettings'):
              obj=json.load(open(f'/tmp/{action}.json', encoding='utf-8'))
              if isinstance(obj,list):
                  print(f'{action}: type=list count={len(obj)}')
              elif isinstance(obj,dict):
                  keys=','.join(sorted(obj.keys()))
                  list_counts=[]
                  for k,v in obj.items():
                      if isinstance(v,list): list_counts.append(f'{k}={len(v)}')
                  suffix=(' lists:' + ','.join(list_counts)) if list_counts else ''
                  print(f'{action}: type=dict keys={keys}{suffix}')
              else:
                  print(f'{action}: type={type(obj).__name__}')
          PY
