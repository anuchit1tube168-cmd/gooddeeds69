name: Good Deed live E2E diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-live-e2e.yml'

permissions:
  contents: read

jobs:
  live-e2e-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
      CF_URL: https://rtafnc-one-gateway-staging.anuchit1tube168.workers.dev
      ORIGIN: https://anuchit1tube168-cmd.github.io
      TEST_ID: '9999999'
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RTAFNC_GAS_SECRET_PRESENT: ${{ secrets.RTAFNC_GOODDEED_GAS_URL }}
    steps:
      - name: Check real GAS health and public pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "$GAS_URL?action=health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('status') == 'success', d
          assert 'GoodDeeds 69 Cloud Engine Active' in str(d.get('message', '')), d
          assert d.get('spreadsheetName') == 'ฐานข้อมูลความดี วพอ 2569', d
          print('GAS_HEALTH_OK spreadsheet=' + d['spreadsheetName'])
          PY
          for url in \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/index.html' \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/student-dashboard.html' \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/staff-login.html?role=teacher'; do
            code=$(curl -L -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url")
            test "$code" = '200'
            echo "HTTP_OK $code $url"
          done

      - name: Probe deployed Cloudflare worker
        shell: bash
        run: |
          set -euo pipefail
          for path in health readiness config; do
            code=$(curl -L -sS --max-time 20 -o "/tmp/cf-$path.json" -w '%{http_code}' "$CF_URL/$path" || true)
            upper=$(printf '%s' "$path" | tr '[:lower:]' '[:upper:]')
            echo "CF_${upper}_HTTP=$code"
            if [ "$code" = "200" ]; then
              python3 - "$path" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              d=json.load(open('/tmp/cf-'+p+'.json',encoding='utf-8'))
          except Exception:
              print('CF_'+p.upper()+'_JSON=invalid')
          else:
              safe={k:v for k,v in d.items() if 'token' not in k.lower() and 'secret' not in k.lower()}
              print('CF_'+p.upper()+'_JSON='+json.dumps(safe,ensure_ascii=False,separators=(',',':')))
          PY
            fi
          done

      - name: Probe legacy GAS read surface without exposing records
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'getStudents:' 'getSummary:9999999' 'getDeeds:9999999'; do
            action="${spec%%:*}"
            sid="${spec#*:}"
            url="$GAS_URL?action=$action"
            [ -n "$sid" ] && url="$url&studentId=$sid"
            code=$(curl -L -sS --max-time 20 -o "/tmp/gas-$action.json" -w '%{http_code}' "$url" || true)
            echo "GAS_${action}_HTTP=$code"
            python3 - "$action" <<'PY'
          import json,sys
          action=sys.argv[1]
          p='/tmp/gas-'+action+'.json'
          try:
              d=json.load(open(p,encoding='utf-8'))
          except Exception:
              print('GAS_'+action+'_SHAPE=non_json')
              continue_flag=False
          else:
              if isinstance(d,list):
                  print('GAS_'+action+'_SHAPE=list count='+str(len(d)))
              elif isinstance(d,dict):
                  keys=sorted(k for k in d.keys() if k not in {'token','secret','password','telegramToken'})
                  print('GAS_'+action+'_SHAPE=dict keys='+','.join(keys[:20]))
                  if 'error' in d: print('GAS_'+action+'_ERROR='+str(d.get('error'))[:120])
              else:
                  print('GAS_'+action+'_SHAPE='+type(d).__name__)
          PY
          done
      - name: Confirm active GAS POST contract
        shell: bash
        run: |
          set -euo pipefail
          req="e2e-login-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'username': os.environ['TEST_ID'], 'password': os.environ['TEST_ID']}))
          PY
          )
          code=$(curl -L -sS --max-time 30 -X POST "$GAS_URL" \
            --data-urlencode 'action=login' \
            --data-urlencode "requestId=$req" \
            --data-urlencode "origin=$ORIGIN" \
            --data-urlencode "payload=$payload" \
            -o /tmp/login.html -w '%{http_code}' || true)
          echo "GAS_LOGIN_POST_HTTP=$code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json, re
          s=open('/tmp/login.html', encoding='utf-8').read()
          m=re.search(r'parent\.postMessage\((\{.*\}),"https://anuchit1tube168-cmd\.github\.io"\)', s)
          if not m:
              print('GAS_POST_CONTRACT=HTTP200_BUT_NO_BRIDGE')
          else:
              d=json.loads(m.group(1))
              print('GAS_POST_CONTRACT=' + ('PASS' if d.get('ok') is True else 'APP_ERROR'))
          PY
          else
            echo "GAS_POST_CONTRACT=UNAVAILABLE"
          fi

      - name: Report reusable deployment credential presence
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_API_TOKEN:-}" ] && echo "CLOUDFLARE_API_TOKEN_PRESENT=yes" || echo "CLOUDFLARE_API_TOKEN_PRESENT=no"
          [ -n "${CF_ACCOUNT_ID:-}" ] && echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=yes" || echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=no"
          [ -n "${RTAFNC_GAS_SECRET_PRESENT:-}" ] && echo "RTAFNC_GOODDEED_GAS_URL_PRESENT=yes" || echo "RTAFNC_GOODDEED_GAS_URL_PRESENT=no"
