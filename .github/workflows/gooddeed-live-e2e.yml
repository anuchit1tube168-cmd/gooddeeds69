name: Good Deed live E2E diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-live-e2e.yml'

permissions:
  contents: read

jobs:
  live-e2e-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
      EXPECTED_BUILD: gooddeeds69-20260920-post-probe-v1
      CF_URL: https://rtafnc-one-gateway-staging.anuchit1tube168.workers.dev
      CLASP_TOKEN_PRESENT: ${{ secrets.CLASP_TOKEN }}
      CLASP_CREDENTIALS_PRESENT: ${{ secrets.CLASP_CREDENTIALS }}
      CLASPRC_JSON_PRESENT: ${{ secrets.CLASPRC_JSON }}
      APPS_SCRIPT_ID_PRESENT: ${{ secrets.APPS_SCRIPT_ID }}
      GOOGLE_SCRIPT_ID_PRESENT: ${{ secrets.GOOGLE_SCRIPT_ID }}
      GAS_SCRIPT_ID_PRESENT: ${{ secrets.GAS_SCRIPT_ID }}
      CF_API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Report deploy credential presence only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLASP_TOKEN_PRESENT:-}" ] && echo "CLASP_TOKEN_PRESENT=yes" || echo "CLASP_TOKEN_PRESENT=no"
          [ -n "${CLASP_CREDENTIALS_PRESENT:-}" ] && echo "CLASP_CREDENTIALS_PRESENT=yes" || echo "CLASP_CREDENTIALS_PRESENT=no"
          [ -n "${CLASPRC_JSON_PRESENT:-}" ] && echo "CLASPRC_JSON_PRESENT=yes" || echo "CLASPRC_JSON_PRESENT=no"
          [ -n "${APPS_SCRIPT_ID_PRESENT:-}" ] && echo "APPS_SCRIPT_ID_PRESENT=yes" || echo "APPS_SCRIPT_ID_PRESENT=no"
          [ -n "${GOOGLE_SCRIPT_ID_PRESENT:-}" ] && echo "GOOGLE_SCRIPT_ID_PRESENT=yes" || echo "GOOGLE_SCRIPT_ID_PRESENT=no"
          [ -n "${GAS_SCRIPT_ID_PRESENT:-}" ] && echo "GAS_SCRIPT_ID_PRESENT=yes" || echo "GAS_SCRIPT_ID_PRESENT=no"
          [ -n "${CF_API_TOKEN_PRESENT:-}" ] && echo "CLOUDFLARE_API_TOKEN_PRESENT=yes" || echo "CLOUDFLARE_API_TOKEN_PRESENT=no"
          [ -n "${CF_ACCOUNT_ID_PRESENT:-}" ] && echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=yes" || echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=no"

      - name: Probe Cloudflare staging readiness
        shell: bash
        run: |
          set -euo pipefail
          for path in health readiness config; do
            code=$(curl -L -sS --max-time 20 -o "/tmp/cf-$path.json" -w '%{http_code}' "$CF_URL/$path" || true)
            upper=$(printf '%s' "$path" | tr '[:lower:]' '[:upper:]')
            echo "CF_${upper}_HTTP=$code"
            if [ "$code" = "200" ]; then
              if jq -e . "/tmp/cf-$path.json" >/dev/null 2>&1; then
                safe=$(jq -c '{status,service,version,appEnv,productionCutover,productionWrite,authSessionEnabled,d1Bound,liffConfigured,adapterConfigured,stagingE2EEnabled,readGate,submitGate,reviewGate,activationGate,pilotGateConfigured,pilotGateEnforced} | with_entries(select(.value != null))' "/tmp/cf-$path.json")
                echo "CF_${upper}_SAFE=$safe"
              else
                echo "CF_${upper}_JSON=invalid"
              fi
            fi
          done

      - name: Probe active GAS GET fingerprint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS --max-time 20 -o /tmp/ping.json -w '%{http_code}' "$GAS_URL?action=ping" || true)
          echo "GAS_PING_HTTP=$code"
          if jq -e . /tmp/ping.json >/dev/null 2>&1; then
            echo "GAS_PING_STATUS=$(jq -r '.status // "missing"' /tmp/ping.json)"
            echo "GAS_PING_BUILD_ID=$(jq -r '.buildId // "missing"' /tmp/ping.json)"
            echo "GAS_PING_POST_PROBE=$(jq -r '.postProbeSupported // "missing"' /tmp/ping.json)"
          else
            echo "GAS_PING_JSON=invalid"
          fi

      - name: Probe active GAS POST contract without writes
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS --max-time 20 -X POST "$GAS_URL" -H 'content-type: application/json' --data '{"action":"deploymentProbe"}' -o /tmp/post.json -w '%{http_code}' || true)
          echo "GAS_POST_PROBE_HTTP=$code"
          if [ "$code" = "200" ] && jq -e . /tmp/post.json >/dev/null 2>&1; then
            echo "GAS_POST_PROBE_STATUS=$(jq -r '.status // "missing"' /tmp/post.json)"
            echo "GAS_POST_PROBE_BUILD_ID=$(jq -r '.buildId // "missing"' /tmp/post.json)"
          else
            echo "GAS_POST_PROBE_RESULT=deployment_not_updated"
          fi

      - name: Fail if active deployment is not reviewed build
        shell: bash
        run: |
          set -euo pipefail
          actual=$(jq -r '.buildId // ""' /tmp/ping.json 2>/dev/null || true)
          if [ "$actual" != "$EXPECTED_BUILD" ]; then
            echo "ACTIVE_GAS_REVIEWED_BUILD=no"
            exit 1
          fi
          echo "ACTIVE_GAS_REVIEWED_BUILD=yes"
