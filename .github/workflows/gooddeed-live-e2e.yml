name: Good Deed live E2E diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gooddeed-live-e2e.yml'

permissions:
  contents: read

jobs:
  live-e2e-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbwV0b31hWMSs2oNOff4o-O_PNoEQ1XlTM77f4sei9JLh1rza1SfFPTOlTaxiIKCIxLT_Q/exec
      ORIGIN: https://anuchit1tube168-cmd.github.io
      TEST_ID: '9999999'
    steps:
      - name: Check real GAS health and public pages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "$GAS_URL?action=health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('status') == 'success', d
          assert 'GoodDeeds 69 Cloud Engine Active' in str(d.get('message', '')), d
          assert d.get('spreadsheetName') == 'ฐานข้อมูลความดี วพอ 2569', d
          print('GAS_HEALTH_OK spreadsheet=' + d['spreadsheetName'])
          PY
          for url in \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/index.html' \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/student-dashboard.html' \
            'https://anuchit1tube168-cmd.github.io/gooddeeds69/frontend/staff-login.html?role=teacher'; do
            code=$(curl -L -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url")
            test "$code" = '200'
            echo "HTTP_OK $code $url"
          done

      - name: Login synthetic student
        shell: bash
        run: |
          set -euo pipefail
          req="e2e-login-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'username': os.environ['TEST_ID'], 'password': os.environ['TEST_ID']}))
          PY
          )
          curl -fsSL --max-time 30 -X POST "$GAS_URL" \
            --data-urlencode 'action=login' \
            --data-urlencode "requestId=$req" \
            --data-urlencode "origin=$ORIGIN" \
            --data-urlencode "payload=$payload" \
            -o /tmp/login.html
          python3 - <<'PY'
          import json, os, re
          s=open('/tmp/login.html', encoding='utf-8').read()
          m=re.search(r'parent\.postMessage\((\{.*\}),"https://anuchit1tube168-cmd\.github\.io"\)', s)
          assert m, 'bridge response not found'
          d=json.loads(m.group(1))
          assert d.get('ok') is True, d
          user=d['data']['user']
          assert str(user.get('studentId')) == os.environ['TEST_ID'], user
          assert user.get('role') == 'student', user
          token=d['data']['sessionToken']
          assert token and len(token) >= 16
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('SESSION_TOKEN=' + token + '\n')
          print('LOGIN_OK role=student studentId=' + str(user['studentId']))
          PY

      - name: Submit clearly marked SYSTEM TEST deed
        shell: bash
        run: |
          set -euo pipefail
          req="e2e-submit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'studentId': os.environ['TEST_ID'],
            'cohort': 'SYSTEM TEST',
            'category': 'SYSTEM TEST',
            'activityDate': '2026-09-20',
            'hours': 0.5,
            'description': 'SYSTEM TEST — GitHub Actions E2E diagnostic; pending only; do not approve'
          }, ensure_ascii=False))
          PY
          )
          curl -fsSL --max-time 30 -X POST "$GAS_URL" \
            --data-urlencode 'action=submitDeed' \
            --data-urlencode "requestId=$req" \
            --data-urlencode "origin=$ORIGIN" \
            --data-urlencode "sessionToken=$SESSION_TOKEN" \
            --data-urlencode "payload=$payload" \
            -o /tmp/submit.html
          python3 - <<'PY'
          import json, re
          s=open('/tmp/submit.html', encoding='utf-8').read()
          m=re.search(r'parent\.postMessage\((\{.*\}),"https://anuchit1tube168-cmd\.github\.io"\)', s)
          assert m, 'bridge response not found'
          d=json.loads(m.group(1))
          assert d.get('ok') is True, d
          deed=d['data']['deed']
          assert deed.get('status') == 'pending', deed
          assert float(deed.get('hours')) == 0.5, deed
          print('SUBMIT_OK recordId=' + str(deed['recordId']) + ' status=' + deed['status'])
          PY
