name: Telegram smoke test (repair branch only)

on:
  push:
    branches: ["telegram-repair-20260916"]
    paths: [".github/workflows/telegram-smoke-test.yml"]

permissions:
  contents: read

jobs:
  telegram-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Send one no-PII Telegram test message using legacy credential from Git history
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('child_process');

          function git(args) {
            return execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] });
          }

          const commits = git(['rev-list', '--all']).trim().split(/\s+/).filter(Boolean);
          let token = '';
          let chatId = '';
          let sourceCommit = '';

          for (const sha of commits) {
            let text = '';
            try { text = git(['show', `${sha}:frontend/app.js`]); } catch (_) { continue; }
            const tokenMatch = text.match(/TELEGRAM_BOT_TOKEN\s*:\s*['\"]([^'\"]{20,})['\"]/);
            const chatMatch = text.match(/TELEGRAM_CHAT_ID\s*:\s*['\"]([^'\"]{5,})['\"]/);
            if (tokenMatch && chatMatch && tokenMatch[1] && chatMatch[1]) {
              token = tokenMatch[1];
              chatId = chatMatch[1];
              sourceCommit = sha;
              break;
            }
          }

          if (!token || !chatId) {
            console.error('telegram_legacy_config=NOT_FOUND');
            process.exit(2);
          }

          console.log(`::add-mask::${token}`);
          console.log(`::add-mask::${chatId}`);
          console.log('telegram_legacy_config=FOUND_MASKED');
          console.log('source_commit_prefix=' + sourceCommit.slice(0, 8));

          async function run() {
            const base = `https://api.telegram.org/bot${token}`;
            const meResp = await fetch(base + '/getMe');
            const me = await meResp.json().catch(() => ({}));
            if (!meResp.ok || me.ok !== true) {
              console.error('telegram_getMe=FAIL http=' + meResp.status);
              process.exit(3);
            }
            console.log('telegram_getMe=PASS');

            const text = '🧪 TEST RTAFNC Good Deed\nทดสอบระบบแจ้งเตือน Telegram เวอร์ชันใหม่\nไม่มีข้อมูลนักเรียน และไม่มีการเปลี่ยนสถานะรายการความดี\nUTC: ' + new Date().toISOString();
            const sendResp = await fetch(base + '/sendMessage', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text, disable_web_page_preview: true })
            });
            const sent = await sendResp.json().catch(() => ({}));
            if (!sendResp.ok || sent.ok !== true) {
              console.error('telegram_sendMessage=FAIL http=' + sendResp.status + ' code=' + (sent.error_code || 'unknown'));
              process.exit(4);
            }
            console.log('telegram_sendMessage=PASS');
            console.log('telegram_test_message_id=' + (sent.result && sent.result.message_id ? sent.result.message_id : 'unknown'));
          }

          run().catch((err) => {
            console.error('telegram_smoke=ERROR ' + (err && err.message ? err.message : 'unknown'));
            process.exit(5);
          });
          NODE
