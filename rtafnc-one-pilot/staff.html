<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061425">
  <title>RTAFNC ONE — Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="responsive-runtime.css?v=1">
  <style>
    .staff-shell{padding:22px 0 110px}.staff-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.staff-head h1{margin:0;font:700 clamp(1.5rem,4vw,2.2rem) Kanit}.staff-meta{color:var(--muted);font-size:.78rem}.cap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cap{padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);min-height:122px}.cap b{display:block;margin:7px 0 4px}.cap small{color:var(--muted)}.locked{opacity:.5}.privacy{margin-top:16px;padding:14px;border:1px solid rgba(215,184,90,.25);border-radius:16px;background:rgba(215,184,90,.06);font-size:.76rem;color:var(--muted)}.empty{padding:24px;text-align:center}.demo-select{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.demo-select a{font-size:.72rem;padding:7px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none}.developer{margin-top:20px;text-align:center;color:var(--muted);font-size:.7rem}@media(max-width:900px){.cap-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cap-grid{grid-template-columns:1fr}.staff-head{flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="wrap topbar-in"><div class="brand"><img data-rtafnc-logo src="../frontend/510903.jpg" alt="ตรา วพอ."><div><strong>RTAFNC ONE · STAFF</strong><small>Role-scoped Operations Portal</small></div></div><div class="pill" id="ay">AY</div></div></header>
  <main class="wrap staff-shell" id="staff-app"></main>
</div>
<script src="config.js?v=4"></script>
<script src="academic-year.js?v=1"></script>
<script src="brand-runtime.js?v=1"></script>
<script>
(function(){
  'use strict';
  const CAPS={
    EXECUTIVE:{title:'Executive Dashboard',scope:'ภาพรวมระดับวิทยาลัย',items:[['📊','ภาพรวมองค์กร','รายงานรวม/แนวโน้มแบบ Aggregate'],['🎖️','Good Deed Summary','ภาพรวม ไม่เปิดบันทึกรายละเอียดโดยไม่จำเป็น'],['💬','Advisor Summary','จำนวนการพบ/ติดตามแบบไม่เปิด Private Note'],['🩺','Health Aggregate','ข้อมูลรวม/ไม่ระบุตัวบุคคลเป็นค่าเริ่มต้น'],['📚','Teaching Summary','ภาพรวมการสอนและนิเทศ'],['🛡️','Operations Summary','สถานะ Workflow สำคัญ']]},
    GOVERNANCE:{title:'Governance Dashboard',scope:'งานปกครองและ Workflow ที่ได้รับมอบหมาย',items:[['✅','อนุมัติความดี','Review / Approve / Return'],['💬','จัดการอาจารย์ที่ปรึกษา','Assignment เท่านั้น ไม่อ่าน Private Note'],['👔','อาภรณ์ภัณฑ์','สิทธิ์/การรับ/การจ่าย'],['📦','ยืมของและพัสดุ','Borrow / Requisition / Stock workflow'],['🎓','ทุนการศึกษา','คิวตรวจและ Workflow'],['📈','รายงานปกครอง','เฉพาะขอบเขตงานปกครอง']]},
    FACULTY:{title:'Faculty Dashboard',scope:'งานสอนและงานที่ได้รับมอบหมายของตนเอง',items:[['📚','งานสอนของฉัน','รายวิชา/นิเทศ/ประเมิน'],['🧾','แบบประเมินของฉัน','เฉพาะรายการที่ได้รับมอบหมาย'],['🎖️','ข้อมูลความดีที่จำเป็น','Read relevant only'],['💬','Advisor Panel','ปรากฏเพิ่มเมื่อมี Assignment ปีปัจจุบัน'],['🎓','ทุน — ความเห็นอาจารย์','เฉพาะนักเรียนที่ได้รับมอบหมาย']]},
    SUPPLY_SUPPORT:{title:'Supply Dashboard',scope:'อาภรณ์ ยืมของ พัสดุ/สินทรัพย์ที่ได้รับมอบหมาย',items:[['👔','อาภรณ์ภัณฑ์','Catalog / จ่าย / รับ / คงเหลือ'],['🔄','ยืม-คืน','อุปกรณ์และรายการค้างคืน'],['📦','พัสดุปกครอง','เบิก/จ่าย/Stock move'],['🏷️','สินทรัพย์','ทะเบียน/ตรวจสอบตามสิทธิ์'],['📈','รายงานคลัง','เฉพาะโมดูลที่รับผิดชอบ']]},
    EDU_IT_SUPPORT:{title:'Education / IT Support',scope:'งานสนับสนุนระบบตามหน้าที่ ไม่เห็นข้อมูลอ่อนไหว',items:[['🪪','บัญชีและการเชื่อมตัวตน','Account support ไม่มี Clinical/Private Note'],['📄','เอกสารและ Workflow','Process support'],['📚','งานสนับสนุนการศึกษา','เฉพาะรายการที่รับผิดชอบ'],['🛠️','สถานะระบบ','Health check / integration status']]},
    SUPPORT:{title:'Support Dashboard',scope:'เห็นเฉพาะโมดูลที่ได้รับมอบหมาย',items:[['🧩','งานที่ได้รับมอบหมาย','Module assigned only'],['📈','รายงานงานของฉัน','Own module only']]},
    HEALTH_AUTHORIZED:{title:'Health Dashboard',scope:'เฉพาะบุคลากรสุขภาพที่ได้รับอนุญาต',items:[['🩺','เวชระเบียน','Authorized patient scope'],['💊','คลังยา','ยา/เวชภัณฑ์ตามสิทธิ์'],['📆','นัดและติดตาม','Referral / Follow-up'],['📈','Health Report','Authorized/Aggregate']]}
  };
  const qs=new URLSearchParams(location.search); const demo=qs.get('demo')==='1';
  let ctx=null; try{ctx=JSON.parse(sessionStorage.getItem('rtafnc_staff_context')||'null')}catch(_){ctx=null}
  if(!ctx&&demo){const role=qs.get('role')||'FACULTY';ctx={display_name:'ตัวอย่างบุคลากร วพอ.',base_role:CAPS[role]?role:'FACULTY',additive_roles:role==='FACULTY'?['ADVISOR_ADDITIVE']:[],demo:true}}
  const root=document.getElementById('staff-app');
  if(!ctx){root.innerHTML='<section class="panel empty"><h2>Staff Portal พร้อมแล้ว</h2><p class="staff-meta">รอการผูก Staff Account กับ LINE/RTAFNC Identity ที่ Backend ยืนยันก่อนเปิดสิทธิ์จริง</p><div class="demo-select"><a href="?demo=1&role=FACULTY">Preview Faculty</a><a href="?demo=1&role=GOVERNANCE">Preview Governance</a><a href="?demo=1&role=SUPPLY_SUPPORT">Preview Supply</a><a href="?demo=1&role=EXECUTIVE">Preview Executive</a></div></section>';return}
  const def=CAPS[ctx.base_role]||CAPS.SUPPORT; const advisor=(ctx.additive_roles||[]).includes('ADVISOR_ADDITIVE');
  const items=def.items.slice(); if(advisor&&!items.some(x=>x[1]==='Advisor Panel'))items.push(['💬','Advisor Panel','เฉพาะนักเรียนที่ปรึกษาของตนเอง']);
  root.innerHTML=`<section class="staff-head"><div><h1>${esc(ctx.display_name||'บุคลากร วพอ.')}</h1><div class="staff-meta">${esc(def.title)} · ${esc(def.scope)}${ctx.demo?' · DEMO PREVIEW':''}</div></div><div class="pill">${esc(ctx.base_role)}</div></section><section class="cap-grid">${items.map(x=>`<article class="cap"><div style="font-size:1.45rem">${x[0]}</div><b>${esc(x[1])}</b><small>${esc(x[2])}</small></article>`).join('')}</section><div class="privacy">🔒 สิทธิ์จาก Backend เป็นตัวตัดสินจริง หน้าเว็บไม่สามารถยกระดับสิทธิ์เองได้ · Advisor Private Notes และเวชระเบียนไม่ตกทอดให้ Admin/IT โดยอัตโนมัติ</div><div class="developer">${esc((window.RTAFNC_ONE_CONFIG||{}).DEVELOPER_DISPLAY||'')}</div>`;
  function esc(v){return String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}
})();
</script>
</body>
</html>
